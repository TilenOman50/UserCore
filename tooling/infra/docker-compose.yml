services:
  postgres:
    image: postgres:16-alpine
    container_name: usercore-postgres
    environment:
      POSTGRES_USER: usercore
      POSTGRES_PASSWORD: usercore
      POSTGRES_DB: usercore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usercore"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: usercore-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: usercore
      RABBITMQ_DEFAULT_PASS: usercore
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: usercore-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: usercore-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: usercore
      MINIO_ROOT_PASSWORD: usercore123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
